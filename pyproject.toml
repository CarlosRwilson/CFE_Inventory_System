[build-system]
build-backend = "setuptools.build_meta"
requires = [
    "setuptools>=77.0.3"
]
[project]
name = "CFE Distribución Ensenada Inventory System"
version = "0.1.0"
authors = [
    { email = "wilsoncarlosraul@gmail.com", name = "Carlos Wilson"}
    {email = "jose.loya@uabc.edu.mx", name = "Jose David Loya"},
]

license = "GNU "
description = "Inventory managment system for tools CFE Ensenada"

dependencies = [
    "python-dotenv>=1.0, <2.0",
    "Django>=5.2,<5.3",
    "waitress>=3.0,<4.0",
    "openpyxl>=3.1,<4.0",
    "pydoc>=3.13, <3.14",
]
[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "ruff>=0.110",
]